<!DOCTYPE html>

    <body>
         <header>
            <div class="heders">
                <p class="friend_pagination">002D</p>

                </div>
            </div>

            <div class="character_loading">

                <div class="character_loading_info">

                    <p class="loading_3">4301</p>
                </div>
                <div class="friend_loading_progress"></div>
            </div>


        <section class="container" id="choose_character">

               <div class="container_elementspack_friend">
                    <p class="coditions_rewardes">Get 5 friends to join and explore the <span class="head_edit"> world of ETHOS  and receive EPIC rewards!</span></p>
                <div class="aute_friend">
                    <article  class="art_Card">
                        <img src="assets/img/Necklace Card.png" class="Card" alt="Necklace Card">
                    </article>
                    
                    <article  class="art_Card">
                        <img src="assets/img/NFT Card.png" class="Card" alt="NFT Card">

                    </article>

                    <article  class="art_Card">
                        <img src="assets/img/Discord Card.png" class="Card" alt="Discord Card">
                         <img src="assets/img/discord.png" class="text_card" alt="text">
                    </article>

                    <article  class="art_Card">
                        <img src="assets/img/Gold Card.png" class="Card" alt="Gold Card">
                         <img src="assets/img/1,000 gold.png" class="text_card" alt="text">
                    </article>
                </div>
                    
                <div class="button">
                       
                         <button class="button_copier_share">
                            <p class="code">A0B41C6</p>
                        </button>

                        <p class="share"></p>

                        <button class="code_generate_button">
                            <p class="code_generate_text">Generate your code</p>
                        </button>
                </div>
                 <img src="assets/img/Vector-1.png" class="copier" alt="copier">
                 <img src="assets/img/Vector.png" class="copier_sha" alt="copier_sha">
                  
                 <a href="#share_op">
                 <img src="assets/img/Vector (2).png" class="partager" alt="partager">
               </a>
                 
                 <img src="assets/img/Vector@4x.png" class="partager_sha" alt="partager">
                 <img src="assets/img/Vector@=4x.png" class="partager_cheak" alt="partager">  
        </div>
        </div>

        







<div id="share_op" class="page_option_share">
  <div class="share_op">
     <div class="items_share">
        <p class="character_pagination--head1">Share to your friend by using these</p>
        <div class="moyenne_invitation">
            <img src="assets/img/Group 24.png" alt="instagram" class="moyenne_invitation_general">
            <img src="assets/img/Group 26 (1).png" alt="x" class="moyenne_invitation_general" >
            <img src="assets/img/Group 25.png" alt="facebook" class="moyenne_invitation_face" >
            <img src="assets/img/Group 27.png" alt="discord" class="moyenne_invitation_general" >
        </div>
        <button class="button_copier_share">
             <p class="code">A0B41C6</p>
        </button>
</div>
